<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>responsive check</title>
<style>
  body { margin: 0; background: #ddd; font-family: sans-serif; }
  .row { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  iframe { border: 0; background: #fff; box-shadow: 0 0 6px rgba(0,0,0,.2); }
  .m { width: 390px; height: 900px; }
  .s { width: 360px; height: 900px; }
</style>
</head>
<body>
<div class="row">
  <iframe class="m" src="/?lang=ko#blog-spotlight-title" scrolling="no"></iframe>
  <iframe class="s" src="/?lang=en#blog-spotlight-title" scrolling="no"></iframe>
</div>
<script>
  // scroll each iframe to the spotlight section
  window.addEventListener('load', function () {
    document.querySelectorAll('iframe').forEach(function (f) {
      f.addEventListener('load', function () {
        try {
          var d = f.contentDocument;
          var t = d.getElementById('blog-spotlight-title');
          if (t) { f.contentWindow.scrollTo(0, t.getBoundingClientRect().top + f.contentWindow.scrollY - 20); }
        } catch (e) {}
      });
    });
  });
</script>
</body>
</html>
