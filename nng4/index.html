<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f4f1ea">
<meta name="description" content="Lean 4 자연수 게임(Natural Number Game 4) 한국어판 — 모바일에서 즐기는 인터랙티브 수학 증명 게임">
<title>자연수 게임 · 한국어판</title>
<style>:root {
  --bg: #f4f1ea;
  --panel: #fffdf8;
  --ink: #23201b;
  --ink-2: #6a6255;
  --ink-3: #9b9284;
  --line: #e2dbcd;
  --accent: #5b8def;
  --ok: #2f9e6b;
  --bad: #c8433a;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
  --r: 12px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}

button { font-family: inherit; font-size: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
code, .mono { font-family: var(--mono); }

#app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

/* ---------- 공통 ---------- */
.screen { display: none; flex-direction: column; height: 100%; min-height: 0; }
.screen.on { display: flex; }

header.bar {
  flex: none;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  padding-top: calc(8px + env(safe-area-inset-top));
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  min-height: 46px;
}
header.bar h1 {
  font-size: 14px; font-weight: 700; margin: 0; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
header.bar .sub { font-size: 11px; color: var(--ink-3); font-weight: 500; }
.iconbtn {
  width: 32px; height: 32px; border-radius: 9px; flex: none;
  display: grid; place-items: center; font-size: 15px;
  background: #efeae0; color: var(--ink-2);
}
.iconbtn:active { background: #e3ddcf; }
.pill {
  font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  background: #efeae0; color: var(--ink-2); flex: none;
}

/* ---------- 홈 ---------- */
#scr-home .scroll { flex: 1; overflow-y: auto; padding: 18px 16px 40px; }
.brand { text-align: center; padding: 10px 0 4px; }
.brand .kicker { font-size: 11px; letter-spacing: .18em; color: var(--ink-3); text-transform: uppercase; }
.brand h1 { font-size: 30px; margin: 6px 0 4px; letter-spacing: -.02em; }
.brand .lede { color: var(--ink-2); font-size: 13.5px; }
.logo {
  width: 76px; height: 76px; margin: 8px auto 6px; border-radius: 22px;
  display: grid; place-items: center; font-family: var(--mono); font-size: 30px;
  background: linear-gradient(145deg, #6c9bf5, #4a6fd4); color: #fff;
  box-shadow: 0 10px 24px -12px #4a6fd4;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 18px; border-radius: 12px; font-weight: 700; font-size: 15px;
  background: var(--ink); color: #fff;
}
.btn.wide { width: 100%; }
.btn.ghost { background: #efeae0; color: var(--ink); }
.btn.accent { background: var(--accent); }
.btn:active { filter: brightness(.93); }
.progressline { height: 6px; border-radius: 999px; background: #e7e1d4; overflow: hidden; }
.progressline > i { display: block; height: 100%; background: var(--ok); }

/* ---------- 맵 ---------- */
#scr-map .scroll { flex: 1; overflow-y: auto; padding: 12px 12px 40px; }
.wcard {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  margin-bottom: 10px; overflow: hidden;
}
.wcard .head { display: flex; align-items: center; gap: 10px; padding: 12px 12px; }
.wcard .badge {
  width: 32px; height: 32px; border-radius: 10px; flex: none;
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 14px;
}
.wcard .t { flex: 1; min-width: 0; }
.wcard .t b { display: block; font-size: 14.5px; }
.wcard .t span { font-size: 11.5px; color: var(--ink-3); }
.wcard .meta { font-size: 11px; color: var(--ink-2); font-weight: 700; flex: none; }
.wcard .bar { padding: 0 12px 12px; }
.wcard.locked { opacity: .62; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; padding: 0 12px 12px; }
.lvbtn {
  aspect-ratio: 1; border-radius: 9px; background: #f0ebe0; color: var(--ink-2);
  font-size: 13px; font-weight: 700; display: grid; place-items: center;
  border: 1.5px solid transparent;
}
.lvbtn.cleared { background: #dff0e6; color: #1f7a50; border-color: #bfe2cf; }
.lvbtn.current { background: #fff; border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px rgba(91,141,239,.13); }
.lvbtn.lock { background: #efeae0; color: #c6bfb1; }
.wintro { padding: 0 12px 12px; font-size: 12.5px; color: var(--ink-2); }

/* ---------- 레벨 ---------- */
#level { background: var(--bg); }
.goalbox {
  flex: 1 1 auto; min-height: 104px; overflow-y: auto;
  padding: 10px 12px 12px; background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.glabel { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
.glabel .cnt { color: var(--accent); letter-spacing: 0; text-transform: none; font-weight: 700; }
.goal {
  font-family: var(--mono); font-size: 15px; line-height: 1.45;
  margin: 3px 0 10px; word-break: break-word;
  padding: 8px 10px; border-radius: 9px; background: #f7f3e9; border-left: 3px solid var(--accent);
}
.goal.empty { border-left-color: var(--ok); color: #1f7a50; }
.hyps { display: flex; flex-wrap: wrap; gap: 5px 10px; }
.hyp {
  font-family: var(--mono); font-size: 12.5px; color: var(--ink-2);
  background: #f7f3e9; border-radius: 7px; padding: 2px 7px;
  max-width: 100%; overflow-wrap: anywhere;
}
.hyp b { color: var(--ink); font-weight: 700; }
.hyp .ty { color: var(--ink-2); }
.newbox { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.newbox .lb { font-size: 10.5px; font-weight: 800; color: var(--ink-3); letter-spacing: .06em; }
.newbox .it { font-family: var(--mono); font-size: 11.5px; background: #e9f2ec; color: #1f7a50; border-radius: 6px; padding: 2px 7px; }
.newbox .it.t { background: #e3ecff; color: #2f5fb8; }

.codebox { flex: none; background: #23201b; color: #f0ece2; max-height: 40vh; display: flex; flex-direction: column; }
.lines { overflow-y: auto; padding: 8px 10px 2px; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; min-height: 26px; max-height: 22vh; }
.line { display: flex; gap: 8px; white-space: pre-wrap; word-break: break-word; }
.line .n { color: #7d7566; flex: none; width: 14px; text-align: right; }
.line.err { color: #ff9d92; }
.line .mark { color: #6f9d5a; }
.inputrow { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-top: 1px solid #38332b; background: #1b1815; }
.inputrow .caret { color: #8fd18f; font-family: var(--mono); font-size: 13px; }
#cmd {
  flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
  color: #fff; font-family: var(--mono); font-size: 14px; padding: 6px 2px;
}
#cmd::placeholder { color: #6f6659; }
.runbtn {
  flex: none; background: #3c7d4e; color: #fff; font-weight: 800; font-size: 13px;
  padding: 9px 14px; border-radius: 9px;
}
.runbtn:active { filter: brightness(1.15); }

.actionrow { flex: none; display: flex; gap: 6px; padding: 7px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
.act { flex: 1; padding: 9px 4px; border-radius: 9px; background: #efeae0; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.act:active { background: #e3ddcf; }
.act.primary { background: #e3ecff; color: #2f5fb8; }
.act:disabled { opacity: .4; }

.palette { flex: none; background: var(--panel); border-bottom: 1px solid var(--line); padding: 6px 0 6px; }
.prow { display: flex; gap: 6px; overflow-x: auto; padding: 0 8px; scrollbar-width: none; }
.prow::-webkit-scrollbar { display: none; }
.prow + .prow { margin-top: 6px; }
.chip {
  flex: none; padding: 6px 10px; border-radius: 999px; font-family: var(--mono);
  font-size: 12.5px; background: #f0ebe0; color: var(--ink); border: 1px solid #e2dbcd;
  white-space: nowrap;
}
.chip:active { background: #e5dfd1; }
.chip.sym { background: #fff; color: #4c4639; font-weight: 700; }
.chip.hot { background: #e3ecff; border-color: #c4d6fb; color: #2f5fb8; }

.dock { flex: 0 1 auto; max-height: 46vh; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: flex; flex: none; border-bottom: 1px solid var(--line); }
.tab {
  flex: 1; padding: 10px 4px; font-size: 12.5px; font-weight: 700; color: var(--ink-3);
  border-bottom: 2px solid transparent;
}
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.tabbody { overflow-y: auto; padding: 10px 12px 16px; flex: 1 1 auto; min-height: 60px; }
.tabbody.hide { display: none; }

.card { background: #f7f3e9; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.card h4 { margin: 0 0 4px; font-size: 13px; font-family: var(--mono); }
.card p { margin: 0 0 6px; font-size: 12.5px; color: var(--ink-2); }
.card p:last-child { margin-bottom: 0; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 5px; padding: 1px 5px; margin-left: 5px; vertical-align: 1px; }
.tag.new { background: var(--ok); }
.thm { padding: 8px 0; border-bottom: 1px dashed #e6e0d2; }
.thm:last-child { border-bottom: 0; }
.thm .nmrow { display: flex; align-items: center; gap: 6px; }
.thm .nm { font-family: var(--mono); font-size: 12.5px; font-weight: 700; flex: 1; min-width: 0; }
.thm .st { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); display: block; margin-top: 3px; word-break: break-word; }
.thm .st.ko { font-family: var(--sans); font-size: 12px; line-height: 1.5; }
.thm button.use { flex: none; font-size: 11px; font-weight: 800; color: var(--accent); background: #eef3ff; border-radius: 7px; padding: 4px 9px; }
.hintitem { font-size: 13px; padding: 9px 11px; background: #fff8e2; border-radius: 9px; margin-bottom: 7px; border: 1px solid #f0e3bd; display: flex; gap: 8px; }
.hintitem .num { flex: none; }
.hintitem .hbody { flex: 1; min-width: 0; }
.hintitem .hbody .md { font-size: 13px; }
.hintitem .hbody .md p:last-child { margin-bottom: 0; }
.hintitem .num { font-weight: 800; color: #a2801f; margin-right: 5px; }
.hintmore { width: 100%; padding: 10px; border-radius: 9px; background: #efeae0; font-weight: 700; font-size: 12.5px; color: var(--ink-2); }
.muted { color: var(--ink-3); font-size: 12.5px; }
.sec { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; margin: 12px 0 4px; }
.sec:first-child { margin-top: 0; }

/* ---------- 시트/모달 ---------- */
.sheetwrap { position: fixed; inset: 0; background: rgba(20,17,12,.45); display: none; z-index: 40; }
.sheetwrap.on { display: block; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 88dvh;
  background: var(--panel); border-radius: 18px 18px 0 0; display: flex; flex-direction: column;
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
.sheet .sh { display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px; }
.sheet .sh h3 { margin: 0; font-size: 15px; flex: 1; }
.sheet .sb { overflow-y: auto; padding: 0 16px 22px; }

/* ---------- 마크다운 ---------- */
.md { font-size: 13.5px; line-height: 1.62; color: #3a352c; }
.md h3 { font-size: 16px; margin: 14px 0 6px; color: var(--ink); }
.md h4 { font-size: 14px; margin: 13px 0 5px; color: var(--ink); }
.md h5 { font-size: 13px; font-weight: 800; margin: 12px 0 4px; color: var(--ink); }
.md p { margin: 0 0 9px; }
.md ul { margin: 0 0 9px; padding-left: 18px; }
.md li { margin: 0 0 4px; }
.md code { background: #efe9dc; padding: 1px 5px; border-radius: 5px; font-size: 12.5px; color: #7a3f22; }
.md pre { background: #23201b; color: #ece7dc; padding: 10px 12px; border-radius: 9px; overflow-x: auto; margin: 0 0 10px; }
.md pre code { background: none; color: inherit; padding: 0; font-size: 12px; }
.md strong { color: var(--ink); }
.md .math { font-family: var(--mono); font-style: italic; }

/* ---------- 클리어 오버레이 ---------- */
.clearbox { text-align: center; padding: 6px 0 12px; }
.clearbox .em { font-size: 34px; }
.clearbox h3 { margin: 6px 0 2px; }
.clearbox p { color: var(--ink-2); font-size: 13px; }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(20px);
  background: #23201b; color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 999px;
  opacity: 0; pointer-events: none; transition: .2s; z-index: 60; max-width: 88vw; text-align: center;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

.errbar {
  background: #fbe9e7; color: #a3352c; font-size: 12.5px; padding: 8px 12px;
  border-bottom: 1px solid #f3cfca; display: none; white-space: pre-wrap;
}
.errbar.on { display: block; }

@media (min-width: 560px) {
  #app { max-width: 520px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  body { background: #ebe6db; }
}

.levelnote { margin-top: 14px; padding-top: 11px; border-top: 1px dashed var(--line); }
.levelnote .md { font-size: 12.5px; color: #4a4438; }
.levelnote .md h3, .levelnote .md h4 { font-size: 13px; margin: 10px 0 4px; }
.levelnote .md h5 { font-size: 12.5px; }
.levelnote .md p { margin: 0 0 7px; }
.levelnote .md code { font-size: 11.5px; }
</style>
</head>
<body>
<div id="app">

  <!-- 홈 -->
  <section id="scr-home" class="screen on">
    <div class="scroll" id="homeBody"></div>
  </section>

  <!-- 월드 맵 -->
  <section id="scr-map" class="screen">
    <header class="bar">
      <button class="iconbtn" id="backHome" aria-label="홈">←</button>
      <h1>월드 맵</h1>
      <span class="pill">NNG4 · KR</span>
    </header>
    <div class="scroll" id="mapBody"></div>
  </section>

  <!-- 레벨 -->
  <section id="scr-level" class="screen">
    <header class="bar">
      <button class="iconbtn" id="backMap" aria-label="맵">←</button>
      <div style="flex:1;min-width:0">
        <h1 id="lvTitle">레벨</h1>
        <div class="sub" id="lvSub"></div>
      </div>
      <button class="iconbtn" id="lvInfo" aria-label="설명">?</button>
    </header>

    <div class="goalbox" id="goalbox"></div>

    <div class="codebox">
      <div class="lines" id="lines"></div>
      <div class="inputrow">
        <span class="caret">▶</span>
        <input id="cmd" type="text" inputmode="text" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" placeholder="전술 입력 · 예: rw [h]">
        <button class="runbtn" id="run">실행</button>
      </div>
    </div>

    <div class="errbar" id="errbar"></div>

    <div class="actionrow">
      <button class="act" id="btnUndo">↶ 되돌리기</button>
      <button class="act" id="btnHint">💡 힌트</button>
      <button class="act" id="btnReset">⟲ 초기화</button>
    </div>

    <div class="palette" id="palette">
      <div class="prow" id="prowTac"></div>
      <div class="prow" id="prowSym"></div>
    </div>

    <div class="dock">
      <div class="tabs" id="tabs"></div>
      <div class="tabbody" id="tabBody"></div>
    </div>
  </section>

</div>

<div class="sheetwrap" id="sheetwrap">
  <div class="sheet">
    <div class="sh"><h3 id="sheetTitle"></h3><button class="iconbtn" id="sheetClose" onclick="document.getElementById('sheetwrap').classList.remove('on')">✕</button></div>
    <div class="sb" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>/* ===== 엔진 ===== */
;
/* =====================================================================
   NNG4-KR · 경량 Lean 4 증명 엔진 (Natural Number Game 4 한국어판)
   - 항(AST) 기반 목표 상태, 전술 실행, 통일(unification), 재작성(rewrite)
   ===================================================================== */
(function (root) {
  'use strict';

  /* ---------------------------- 항(AST) ---------------------------- */
  var NAT = { t: 'nat' };
  var FALSE = { t: 'false' };
  var TRUE = { t: 'true' };

  function num(n) { return { t: 'num', v: n }; }
  function vr(n) { return { t: 'var', n: n }; }
  function succ(a) { return { t: 'succ', a: a }; }
  function add(a, b) { return { t: 'add', a: a, b: b }; }
  function mul(a, b) { return { t: 'mul', a: a, b: b }; }
  function pw(a, b) { return { t: 'pow', a: a, b: b }; }
  function eq(a, b) { return { t: 'eq', a: a, b: b }; }
  function imp(a, b) { return { t: 'imp', a: a, b: b }; }
  function or(a, b) { return { t: 'or', a: a, b: b }; }
  function and(a, b) { return { t: 'and', a: a, b: b }; }
  function le(a, b) { return { t: 'le', a: a, b: b }; }
  function ex(v, body) { return { t: 'ex', v: v, body: body }; }
  function all(v, body) { return { t: 'all', v: v, body: body }; }
  function isZero(a) { return { t: 'isZero', a: a }; }
  function pred(a) { return { t: 'pred', a: a }; }
  function ne(a, b) { return imp(eq(a, b), FALSE); }

  var HOLE_ID = 0;
  function hole() { return { t: 'hole', id: ++HOLE_ID }; }

  function kids(t) {
    switch (t.t) {
      case 'succ': case 'pred': case 'isZero': return [t.a];
      case 'add': case 'mul': case 'pow': case 'eq': case 'imp':
      case 'or': case 'and': case 'le': return [t.a, t.b];
      case 'ex': case 'all': return [t.body];
      default: return [];
    }
  }
  function withKids(t, ks) {
    var c = { t: t.t };
    switch (t.t) {
      case 'succ': case 'pred': case 'isZero': c.a = ks[0]; break;
      case 'add': case 'mul': case 'pow': case 'eq': case 'imp':
      case 'or': case 'and': case 'le': c.a = ks[0]; c.b = ks[1]; break;
      case 'ex': case 'all': c.v = t.v; c.body = ks[0]; break;
      default: throw new Error('withKids: ' + t.t);
    }
    if (t.t === 'num') c.v = t.v;
    if (t.t === 'var') c.n = t.n;
    return c;
  }

  function exprEq(a, b) {
    if (!a || !b) return false;
    if (a.t !== b.t) return false;
    switch (a.t) {
      case 'num': return a.v === b.v;
      case 'var': case 'name': return a.n === b.n;
      case 'nat': case 'false': case 'true': return true;
      case 'ex': case 'all': return exprEq(a.body, substOne(b.body, b.v, vr(a.v)));
      default: {
        var ka = kids(a), kb = kids(b);
        if (ka.length !== kb.length) return false;
        for (var i = 0; i < ka.length; i++) if (!exprEq(ka[i], kb[i])) return false;
        return true;
      }
    }
  }

  function hasVar(t, name) {
    if (t.t === 'var') return t.n === name;
    if ((t.t === 'ex' || t.t === 'all') && t.v === name) return false;
    var ks = kids(t);
    for (var i = 0; i < ks.length; i++) if (hasVar(ks[i], name)) return true;
    return false;
  }

  var FRESH = 0;
  function freshName(base, avoid) {
    var n = base + "'";
    while (avoid && avoid.indexOf(n) >= 0) n += "'";
    FRESH++;
    return n;
  }

  function substOne(t, name, rep) {
    if (t.t === 'var') return t.n === name ? rep : t;
    if (t.t === 'ex' || t.t === 'all') {
      if (t.v === name) return t;
      var body = substOne(t.body, name, rep);
      return { t: t.t, v: t.v, body: body };
    }
    var ks = kids(t);
    if (!ks.length) return t;
    var changed = false, nk = [];
    for (var i = 0; i < ks.length; i++) {
      var k = substOne(ks[i], name, rep);
      if (k !== ks[i]) changed = true;
      nk.push(k);
    }

  /* --------------------- 명제 논리(tauto) --------------------- */
  function atomsOf(t, acc) {
    if (t.t === 'imp' || t.t === 'or' || t.t === 'and' || t.t === 'true' || t.t === 'false') {
      kids(t).forEach(function (k) { atomsOf(k, acc); });
      return acc;
    }
    if (!acc.some(function (a) { return exprEq(a, t); })) acc.push(t);
    return acc;
  }
  function evalWith(t, val) {
    switch (t.t) {
      case 'true': return true;
      case 'false': return false;
      case 'imp': if (!evalWith(t.a, val)) return true; return evalWith(t.b, val);
      case 'or': return evalWith(t.a, val) || evalWith(t.b, val);
      case 'and': return evalWith(t.a, val) && evalWith(t.b, val);
      default: {
        for (var i = 0; i < val.atoms.length; i++) if (exprEq(val.atoms[i], t)) return val.bits[i];
        return true;
      }
    }
  }
  function tauto(g) {
    var atoms = [];
    atomsOf(g.target, atoms);
    g.hyps.forEach(function (h) { atomsOf(h.type, atoms); });
    // 닫힌 원자는 미리 평가
    var free = [], fixed = [];
    atoms.forEach(function (a) {
      var v = evalProp(a);
      fixed.push(v); if (v === null) free.push(a);
    });
    if (free.length > 14) return false;
    var n = free.length;
    var total = Math.pow(2, n);
    for (var m = 0; m < total; m++) {
      var bits = [], idx = 0;
      for (var i = 0; i < atoms.length; i++) {
        if (fixed[i] === null) { bits.push(!!((m >> idx) & 1)); idx++; }
        else bits.push(fixed[i]);
      }
      var val = { atoms: atoms, bits: bits };
      var ok = g.hyps.every(function (h) { return evalWith(h.type, val); });
      if (ok && !evalWith(g.target, val)) return false;
    }
    return true;
  }

  /* --------------------- AC 정규화 (simp) --------------------- */
  function acFlatten(t, op, accIn) {
    var acc = accIn || [];
    if (t.t === op) { acFlatten(t.a, op, acc); acFlatten(t.b, op, acc); }
    else acc.push(t);
    return acc;
  }
  function acKey(t) { return pp(t, 0); }
  function acNorm(t) {
    if (t.t === 'add' || t.t === 'mul') {
      var leaves = acFlatten(t, t.t, []);
      var norm = leaves.map(function (x) {
        x = acNorm(x);
        return x;
      });
      norm.sort(function (a, b) {
        var ka = acKey(a), kb = acKey(b);
        return ka < kb ? -1 : ka > kb ? 1 : 0;
      });
      var r = norm[0];
      for (var i = 1; i < norm.length; i++) r = t.t === 'add' ? add(r, norm[i]) : mul(r, norm[i]);
      return r;
    }
    var ks = kids(t);
    if (!ks.length) return t;
    var nk = ks.map(acNorm);
    if (t.t === 'ex' || t.t === 'all') return { t: t.t, v: t.v, body: nk[0] };
    return withKids(t, nk);
  }

  /* ------------------------ 전술 해석 ------------------------ */
  var TACTICS = {};

  TACTICS.rfl = function (st) {
    var g = st.goals[0];
    if (g.target.t === 'eq' && defEq(g.target.a, g.target.b)) return closeGoal(st);
    if (g.target.t === 'true') return closeGoal(st);
    throw TErr('`rfl`은 양변이 같은 `X = X` 꼴에서만 통합니다.', '지금 목표: ' + pp(g.target));
  };

  TACTICS.trivial = function (st) {
    var g = st.goals[0];
    if (g.target.t === 'true') return closeGoal(st);
    if (g.target.t === 'eq' && defEq(g.target.a, g.target.b)) return closeGoal(st);
    if (evalProp(g.target) === true) return closeGoal(st);
    throw TErr('`trivial`로 닫히지 않습니다. 목표: ' + pp(g.target));
  };

  TACTICS.decide = function (st) {
    var g = st.goals[0];
    var v = evalProp(g.target);
    if (v === true) return closeGoal(st);
    if (v === false) throw TErr('목표가 거짓입니다: ' + pp(g.target));
    throw TErr('`decide`는 변수가 없는 닫힌 식에서만 쓸 수 있습니다.');
  };

  TACTICS.tauto = function (st) {
    var g = st.goals[0];
    if (tauto(g)) return closeGoal(st);
    throw TErr('`tauto`로는 이 목표를 닫을 수 없습니다(명제 논리적으론 참이 아님).');
  };

  TACTICS.symm = function (st, args, at) {
    if (at && at.length) {
      var g0 = st.goals[0];
      var i = findHyp(g0, at[0]);
      if (i < 0) throw TErr('가정 `' + at[0] + '`을 찾을 수 없습니다.');
      g0.hyps[i].type = symmOf(g0.hyps[i].type);
      return st;
    }
    var g = st.goals[0];
    g.target = symmOf(g.target);
    return st;
  };
  function symmOf(t) {
    if (t.t === 'eq') return eq(t.b, t.a);
    if (t.t === 'imp' && t.b.t === 'false' && t.a.t === 'eq') return imp(eq(t.a.b, t.a.a), FALSE);
    if (t.t === 'le') throw TErr('`≤`에는 `symm`을 쓸 수 없습니다.');
    throw TErr('`symm`을 적용할 수 있는 등식이 아닙니다: ' + pp(t));
  }

  TACTICS.intro = function (st, args) {
    var g = st.goals[0];
    var name = (args && args[0]) || null;
    if (g.target.t === 'imp') {
      var nm = name || 'h';
      if (findHyp(g, nm) >= 0) nm = freshName(nm, g.hyps.map(function (h) { return h.name; }));
      g.hyps.push({ name: nm, type: g.target.a });
      g.target = g.target.b;
      return st;
    }
    if (g.target.t === 'all') {
      var nm2 = name || g.target.v;
      if (findHyp(g, nm2) >= 0) nm2 = freshName(nm2, g.hyps.map(function (h) { return h.name; }));
      g.hyps.push({ name: nm2, type: NAT });
      g.target = substOne(g.target.body, g.target.v, vr(nm2));
      return st;
    }
    if (g.target.t === 'ex') throw TErr('`∃` 목표는 `use`로 풉니다.');
    throw TErr('`intro`를 적용할 수 있는 함축/∀ 목표가 아닙니다: ' + pp(g.target));
  };

  TACTICS.exact = function (st, argText) {
    var g = st.goals[0];
    var e = resolveLocals(parseTermText(argText), g);
    var ty = typeOf(e, g);
    if (defEq(ty, g.target)) return closeGoal(st);
    throw TErr('`' + argText + '`의 타입이 목표와 다릅니다.',
      '기대: ' + pp(g.target) + '\n제시: ' + pp(ty));
  };

  TACTICS.apply = function (st, argText, at) {
    var g = st.goals[0];
    var e = resolveLocals(parseTermText(argText), g);
    var ty = forallToHoles(typeOf(e, g));

    if (at && at.length) {
      var idx = findHyp(g, at[0]);
      if (idx < 0) throw TErr('가정 `' + at[0] + '`을 찾을 수 없습니다.');
      var hypType = g.hyps[idx].type;
      var pre = [], c = ty;
      while (c.t === 'imp') { pre.push(c.a); c = c.b; }
      if (!pre.length) throw TErr('`' + argText + '`에는 적용할 전제가 없습니다.');
      var sub = {};
      if (!unify(pre[0], hypType, sub)) {
        throw TErr('`' + argText + '`의 전제가 `' + at[0] + '`의 타입과 맞지 않습니다.',
          '전제: ' + pp(pre[0]) + '\n가정: ' + pp(hypType));
      }
      var rest = c;
      for (var i = pre.length - 1; i >= 1; i--) rest = imp(pre[i], rest);
      rest = applySub(rest, sub);
      if (hasHole(rest)) throw TErr('타입 인자를 추론하지 못했습니다.');
      g.hyps[idx].type = rest;
      return st;
    }

    // 목표 전체와 바로 일치하면 닫는다 (apply h 로 목표가 곧 h의 타입일 때)
    var sub2 = {};
    if (unify(ty, g.target, sub2) && !hasHole(applySub(ty, sub2))) return closeGoal(st);

    var pre2 = [], c2 = ty;
    while (c2.t === 'imp') { pre2.push(c2.a); c2 = c2.b; }
    var sub3 = {};
    if (!unify(c2, g.target, sub3)) {
      if (defEq(ty, g.target)) return closeGoal(st);
      throw TErr('`' + argText + '`의 결론이 목표와 맞지 않습니다.',
        '결론: ' + pp(c2) + '\n목표: ' + pp(g.target));
    }
    var newGoals = pre2.map(function (p) {
      var np = applySub(p, sub3);
      if (hasHole(np)) throw TErr('타입 인자를 추론하지 못했습니다.');
      return { hyps: g.hyps.map(function (h) { return { name: h.name, type: h.type }; }), target: np };
    });
    st.goals.splice.apply(st.goals, [0, 1].concat(newGoals));
    return st;
  };

  TACTICS.left = function (st) {
    var g = st.goals[0];
    if (g.target.t !== 'or') throw TErr('`left`는 `A ∨ B` 목표에서만 씁니다.');
    g.target = g.target.a; return st;
  };
  TACTICS.right = function (st) {
    var g = st.goals[0];
    if (g.target.t !== 'or') throw TErr('`right`는 `A ∨ B` 목표에서만 씁니다.');
    g.target = g.target.b; return st;
  };

  TACTICS.use = function (st, argText) {
    var g = st.goals[0];
    var t = resolveLocals(parseTermText(argText), g);
    if (g.target.t === 'le') {
      g.target = eq(g.target.b, add(g.target.a, t));
      return st;
    }
    if (g.target.t === 'ex') {
      g.target = substOne(g.target.body, g.target.v, t);
      return st;
    }
    throw TErr('`use`는 `∃ ...` 또는 `x ≤ y` 목표에서만 씁니다.');
  };

  TACTICS.have = function (st, rest) {
    var g = st.goals[0];
    var m = /^([A-Za-z][A-Za-z0-9_']*)\s*(:=|:)\s*([\s\S]+)$/.exec(rest.trim());
    if (!m) throw TErr('`have h : 타입` 또는 `have h := 증명` 형식으로 적어 주세요.');
    var name = m[1], how = m[2], body = m[3].trim();
    if (findHyp(g, name) >= 0) throw TErr('`' + name + '`이라는 이름이 이미 있습니다.');
    if (how === ':=') {
      var ty1 = typeOf(resolveLocals(parseTermText(body), g), g);
      g.hyps.push({ name: name, type: ty1 });
      return st;
    }
    var ty = resolveLocals(parseTermText(body), g);
    var haveGoal = { hyps: JSON.parse(JSON.stringify(g.hyps)), target: ty, onClose: [{ name: name, type: ty }] };
    st.goals.unshift(haveGoal);
    return st;
  };

  TACTICS.cases = function (st, raw) {
    var g = st.goals[0];
    var m = /^([A-Za-z][A-Za-z0-9_']*)\s*(?:with\s+([\s\S]+))?$/.exec(raw.trim());
    if (!m) throw TErr('`cases h with a b` 형식으로 적어 주세요.');
    var name = m[1];
    var names = m[2] ? m[2].trim().split(/\s+/).filter(Boolean) : [];
    var idx = findHyp(g, name);
    if (idx < 0) throw TErr('`' + name + '`이라는 가정 또는 변수를 찾을 수 없습니다.');
    var ty = g.hyps[idx].type;
    var rest = g.hyps.slice(0, idx).concat(g.hyps.slice(idx + 1));

    if (ty.t === 'le') {
      var w = names[0] || 'c', pr = names[1] || 'h';
      var body = eq(ty.b, add(ty.a, vr(w)));
      var hyps2 = JSON.parse(JSON.stringify(rest));
      hyps2.push({ name: w, type: NAT });
      hyps2.push({ name: pr, type: body });
      st.goals.splice(0, 1, { hyps: hyps2, target: g.target });
      return st;
    }
    if (ty.t === 'ex') {
      var w2 = names[0] || ty.v, pr2 = names[1] || 'h';
      var body2 = substOne(ty.body, ty.v, vr(w2));
      var hyps3 = JSON.parse(JSON.stringify(rest));
      hyps3.push({ name: w2, type: NAT });
      hyps3.push({ name: pr2, type: body2 });
      st.goals.splice(0, 1, { hyps: hyps3, target: g.target });
      return st;
    }
    if (ty.t === 'or') {
      var h1 = JSON.parse(JSON.stringify(rest)); h1.push({ name: names[0] || 'hl', type: ty.a });
      var h2 = JSON.parse(JSON.stringify(rest)); h2.push({ name: names[1] || 'hr', type: ty.b });
      st.goals.splice(0, 1, { hyps: h1, target: g.target }, { hyps: h2, target: g.target });
      return st;
    }
    if (ty.t === 'false') {
      if (names.length) throw TErr('`False` 가정에는 이름을 줄 수 없습니다.');
      return closeGoal(st);
    }
    if (ty.t === 'nat') {
      var d = names[0] || 'd';
      var baseHyps = JSON.parse(JSON.stringify(g.hyps.filter(function (h) { return h.name !== name; })));
      var base = subAll({ hyps: baseHyps, target: g.target }, name, num(0));
      var stepHyps = JSON.parse(JSON.stringify(baseHyps));
      stepHyps.push({ name: d, type: NAT });
      var step = subAll({ hyps: stepHyps, target: g.target }, name, succ(vr(d)));
      st.goals.splice(0, 1, base, step);
      return st;
    }
    throw TErr('`cases`를 적용할 수 없는 대상입니다: ' + name + ' : ' + pp(ty));
  };

  function subAll(goal, name, rep) {
    goal.target = substOne(goal.target, name, rep);
    goal.hyps = goal.hyps.map(function (h) { return { name: h.name, type: substOne(h.type, name, rep) }; });
    return goal;
  }

  TACTICS.induction = function (st, raw) {
    var g = st.goals[0];
    var m = /^([A-Za-z][A-Za-z0-9_']*)\s+with\s+([A-Za-z][A-Za-z0-9_']*)\s+([A-Za-z][A-Za-z0-9_']*)\s*(?:generalizing\s+([A-Za-z][A-Za-z0-9_']*))?$/.exec(raw.trim());
    if (!m) throw TErr('`induction n with d hd` 형식으로 적어 주세요.');
    var v = m[1], d = m[2], ih = m[3], gen = m[4] || null;

    if (gen) return inductionGeneralizing(st, g, v, d, ih, gen);

    var vi = findHyp(g, v);
    if (vi < 0) throw TErr('`' + v + '`이라는 변수를 찾을 수 없습니다.');
    var baseHyps = JSON.parse(JSON.stringify(g.hyps.filter(function (h) { return h.name !== v; })));
    var b = subAll({ hyps: baseHyps, target: g.target }, v, num(0));

    var stepHyps = JSON.parse(JSON.stringify(g.hyps.filter(function (h) { return h.name !== v; })));
    // IH 는 d 기준 목표
    var tmp = { hyps: stepHyps, target: g.target };
    subAll(tmp, v, vr(d));
    var ihTy = tmp.target;
    var stepHyps2 = tmp.hyps.concat([{ name: d, type: NAT }, { name: ih, type: ihTy }]);
    var step = subAll({ hyps: stepHyps2, target: g.target }, v, succ(vr(d)));

    st.goals.splice(0, 1, b, step);
    return st;
  };

  function inductionGeneralizing(st, g, v, d, ih, gen) {
    // gen 변수와 그것에 의존하는 가정을 revert → ∀ 사슬
    var gi = findHyp(g, gen);
    if (gi < 0) throw TErr('`' + gen + '`이라는 변수를 찾을 수 없습니다.');
    var revertedHyps = [];
    var keepHyps = [];
    g.hyps.forEach(function (h) {
      if (h.name === gen) return;
      if (hasVar(h.type, gen)) revertedHyps.push(h);
      else keepHyps.push(h);
    });
    var target = g.target;
    // revert: 가정들을 역순으로 imp, 그 다음 gen 을 ∀
    for (var i = revertedHyps.length - 1; i >= 0; i--) target = imp(revertedHyps[i].type, target);
    target = all(gen, target);

    var savedHyps = JSON.parse(JSON.stringify(keepHyps));
    var b = subAll({ hyps: JSON.parse(JSON.stringify(savedHyps)), target: target }, v, num(0));
    var tmp = { hyps: JSON.parse(JSON.stringify(savedHyps)), target: target };
    subAll(tmp, v, vr(d));
    var ihTy = tmp.target;
    var stepHyps = tmp.hyps.concat([{ name: d, type: NAT }, { name: ih, type: ihTy }]);
    var step = subAll({ hyps: stepHyps, target: target }, v, succ(vr(d)));

    // revert 했던 것들을 다시 intro
    var reintro = [gen].concat(revertedHyps.map(function (h) { return h.name; }));
    [b, step].forEach(function (goal) {
      reintro.forEach(function (nm) {
        if (goal.target.t === 'all') {
          goal.target = substOne(goal.target.body, goal.target.v, vr(nm));
          goal.hyps.push({ name: nm, type: NAT });
        } else if (goal.target.t === 'imp') {
          goal.hyps.push({ name: nm, type: goal.target.a });
          goal.target = goal.target.b;
        }
      });
    });

    st.goals.splice(0, 1, b, step);
    return st;
  }

  TACTICS.contrapose = function (st, raw) {
    var g = st.goals[0];
    var name = raw.trim();
    if (!name) throw TErr('`contrapose h` 형식으로 적어 주세요.');
    var i = findHyp(g, name);
    if (i < 0) throw TErr('`' + name + '`이라는 가정을 찾을 수 없습니다.');
    var hTy = g.hyps[i].type;
    if (g.target.t !== 'imp' || g.target.b.t !== 'false')
      throw TErr('`contrapose`는 `¬A` 꼴 목표에서만 씁니다.');
    if (hTy.t !== 'imp' || hTy.b.t !== 'false')
      throw TErr('`contrapose`는 부정(`≠`) 가정에서만 씁니다.');
    var A = g.target.a, B = hTy.a;
    g.target = B;
    g.hyps[i].type = A;
    return st;
  };

  TACTICS.xyzzy = function (st) { return closeGoal(st); };

  TACTICS.sorry = function () {
    throw TErr('`sorry`는 증명을 끝내지 않습니다. 직접 증명해 보세요!');
  };

  TACTICS.simp_add = function (st) { return simpAC(st, 'add'); };

  function simpAC(st, mode) {
    var g = st.goals[0];
    if (g.target.t !== 'eq') throw TErr('`simp`는 등식 목표에서 씁니다. 목표: ' + pp(g.target));
    var a = acNorm(g.target.a), b = acNorm(g.target.b);
    if (defEq(a, b)) return closeGoal(st);
    g.target = eq(a, b);
    if (defEq(a, b)) return closeGoal(st);
    var v = evalProp(g.target);
    if (v === true) return closeGoal(st);
    throw TErr('`simp` 후에도 목표가 닫히지 않았습니다.', '남은 목표: ' + pp(g.target));
  }

  TACTICS.simp = function (st) { return simpAC(st, "add"); };

  /* ------------------------------ rw ------------------------------ */
  function parseRwSpec(spec) {
    var s = spec.trim();
    var back = false;
    if (s.startsWith('←') || s.startsWith('<-')) { back = true; s = s.slice(1).trim(); }
    var e = parseTermText(s);
    return { back: back, expr: e };
  }

  /* 전술 인자에서 지역 이름(name)을 자유변수(var)로 바꾼다 */
  function resolveLocals(t, g) {
    if (t.t === 'name' && findHyp(g, t.n) >= 0) return vr(t.n);
    if (t.t === 'ex' || t.t === 'all') {
      return { t: t.t, v: t.v, body: resolveLocals(t.body, g) };
    }
    if (t.t === 'app') {
      return { t: 'app', f: t.f, args: t.args.map(function (a) { return resolveLocals(a, g); }) };
    }
    var ks = kids(t);
    if (!ks.length) return t;
    return withKids(t, ks.map(function (k) { return resolveLocals(k, g); }));
  }

  function typeOfRewrite(spec, g) {
    var ty = forallToHoles(typeOf(resolveLocals(spec.expr, g), g));
    var lhs, rhs;
    if (ty.t === 'eq') { lhs = ty.a; rhs = ty.b; }
    else if (ty.t === 'imp' && ty.a.t === 'eq' && ty.b.t === 'false') { lhs = ty.a.a; rhs = ty.a.b; }
    else throw TErr('재작성에는 등식이 필요합니다: ' + pp(ty));
    if (spec.back) { var tmp = lhs; lhs = rhs; rhs = tmp; }
    return { lhs: lhs, rhs: rhs };
  }

  function applyRw(st, goal, spec, nth, where) {
    var r = typeOfRewrite(spec, goal);
    var target = where === 'hyp' ? goal.hyps[findHyp(goal, nth.hyp)].type : goal.target;
    var res = rewriteGo(target, r.lhs, r.rhs, { nth: nth.n || null });
    if (res === null) throw TErr('바꿀 `' + pp(r.lhs) + '` 꼴을 찾지 못했습니다.');
    if (res && res.error === 'nth') throw TErr('`' + pp(r.lhs) + '`이(가) ' + res.count + '번밖에 나오지 않습니다.');
    if (hasHole(res)) throw TErr('재작성 후 알 수 없는 항이 남았습니다.');
    if (where === 'hyp') goal.hyps[findHyp(goal, nth.hyp)].type = res;
    else goal.target = res;
    return res !== target;

      '<div class="logo">λ</div>' +
      '<div class="kicker">NATURAL NUMBER GAME</div>' +
      '<h1>' + esc(NNG_META.title) + '</h1>' +
      '<div class="lede">' + esc(NNG_META.subtitle) + '</div>' +
      '</div>' +
      '<div class="card" style="margin-top:16px"><div class="md">' + md(NNG_META.intro) + '</div></div>' +
      '<button class="btn wide accent" id="goMap" style="margin-top:6px">월드 맵 열기</button>' +
      '<div class="muted" style="text-align:center;margin-top:12px">Lean 4 · Natural Number Game 4 (leanprover-community/NNG4) 한국어판</div>';
    $('goMap').onclick = function () { show('map'); renderMap(); };
  }

  /* ------------------------ 맵 ------------------------ */
  function renderMap() {
    var total = 0, done = 0;
    NNG_WORLDS.forEach(function (w) { total += w.levels.length; done += clearedCount(w); });
    var head =
      '<div class="card">' +
      '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:7px">' +
      '<b style="flex:1;font-size:13.5px">전체 진행률</b>' +
      '<span><b style="font-size:19px">' + done + '</b><span class="muted">/' + total + '</span></span>' +
      '</div>' +
      '<div class="progressline"><i style="width:' + (total ? done / total * 100 : 0) + '%"></i></div>' +
      '<div style="display:flex;align-items:center;gap:8px;margin-top:11px">' +
      '<span class="muted" style="flex:1;font-size:11.5px">게임 규칙</span>' +
      '<button class="pill" id="modeBtn">' + (S.mode === 'free' ? '자유 모드' : '일반 모드') + '</button>' +
      '</div>' +
      '</div>' +
      '<div class="muted" style="margin:0 2px 12px;font-size:11.5px;line-height:1.55">' +
      (S.mode === 'free'
        ? '자유 모드 · 모든 월드와 모든 정리·전술이 열려 있습니다.'
        : '일반 모드 · 앞 월드를 모두 깨면 다음 월드가 열리고, 아직 배우지 않은 정리는 칩에 나오지 않습니다. 막히면 오른쪽 위 버튼으로 자유 모드로 바꿔 보세요.') +
      '</div>';

    var cards = NNG_WORLDS.map(function (w, i) {
      var open = worldOpen(w.id);
      var cc = clearedCount(w), tot = w.levels.length;
      var grid = '';
      if (open) {
        grid = '<div class="wgrid">' + w.levels.map(function (l) {
          var cls = isCleared(w.id, l.n) ? 'cleared' : (l.n === currentLevel(w) ? 'current' : '');
          return '<button class="lvbtn ' + cls + '" data-w="' + w.id + '" data-n="' + l.n + '">' + l.n + '</button>';
        }).join('') + '</div>';
      }
      var introHtml = open ? '' : '<div class="wintro">🔒 ' + (i === 0 ? '' : '앞 월드 「' + NNG_WORLDS[i - 1].title + '」 를 모두 완료하면 열립니다.') + '</div>';
      return '<div class="wcard' + (open ? '' : ' locked') + '">' +
        '<div class="head">' +
        '<div class="badge" style="background:' + colorOf(w.id) + '">' + esc(iconOf(w.id)) + '</div>' +
        '<div class="t"><b>' + esc(w.title) + '</b><span>' + esc(w.subtitle || '') + '</span></div>' +
        '<div class="meta">' + cc + '/' + tot + '</div>' +
        '</div>' +
        '<div class="bar"><div class="progressline"><i style="width:' + (cc / tot * 100) + '%;background:' + colorOf(w.id) + '"></i></div></div>' +
        introHtml + grid +
        '</div>';
    }).join('');

    el.mapBody.innerHTML = head + cards;
    $('modeBtn').onclick = function () {
      S.mode = S.mode === 'free' ? 'normal' : 'free'; save(); renderMap(); renderPalette(); renderDock();
    };
    Array.prototype.forEach.call(el.mapBody.querySelectorAll('.lvbtn'), function (b) {
      b.onclick = function () { openLevel(b.getAttribute('data-w'), parseInt(b.getAttribute('data-n'), 10)); };
    });
  }

  /* ------------------------ 레벨 ------------------------ */
  function openLevel(wid, n) {
    var w = worldById(wid);
    if (!w || !worldOpen(wid)) { toast('아직 잠긴 월드입니다.'); return; }
    var lv = w.levels[n - 1];
    if (!lv) return;
    rt.world = w; rt.level = lv; rt.hint = 0;
    rt.stmt = NNG.parseStatement('Statement ' + lv.statement);

    var saved = (S.code[wid] && S.code[wid][String(n)]) ? S.code[wid][String(n)].slice() : [];
    var st = NNG.mkState({ statement: rt.stmt });
    var ok = [];
    for (var i = 0; i < saved.length; i++) {
      try {
        var nx = NNG.execTactic(NNG.clone(st), saved[i]);
        st = nx; ok.push(saved[i]);
        if (st.goals.length === 0) break;
      } catch (e) { break; }
    }
    rt.lines = ok;
    rt.state = st;
    S.last = { w: wid, n: n }; save();

    $('lvTitle').textContent = lv.title;
    $('lvSub').textContent = w.title + ' · 레벨 ' + n;
    el.errbar.classList.remove('on');
    $('cmd').value = '';
    show('level');
    renderLevel();
    renderPalette();
    renderDock();

    if (!(S.seen[wid] && S.seen[wid][String(n)])) {
      S.seen[wid] = S.seen[wid] || {}; S.seen[wid][String(n)] = 1; save();
      showIntro();
    }
  }

  function showIntro() {
    var lv = rt.level;
    sheet(esc(lv.title),
      '<div class="md">' + md(lv.intro) + '</div>',
      '<button class="btn wide accent" id="introGo">시작하기</button>');
    $('introGo').onclick = closeSheet;
  }

  function hypsHtml(hyps) {
    if (!hyps.length) return '<div class="nohyp">가정 없음</div>';
    var groups = [];
    hyps.forEach(function (h) {
      var last = groups[groups.length - 1];
      if (h.type.t === 'nat' && last && last.type.t === 'nat') last.names.push(h.name);
      else groups.push({ names: [h.name], type: h.type });
    });
    return '<div class="hyps">' + groups.map(function (g) {
      return '<div class="hyp"><b>' + esc(g.names.join(' ')) + '</b> : <span class="ty">' + esc(NNG.pp(g.type)) + '</span></div>';
    }).join('') + '</div>';
  }

  function newStuffHtml() {
    var lv = rt.level; if (!lv) return '';
    var t = (lv.newTacs || []), s = (lv.newThms || []);
    if (!t.length && !s.length) return '';
    var h = '<div class="newbox">';
    if (t.length) h += '<span class="lb">새 전술</span>' + t.map(function (x) { return '<span class="it t">' + esc(x) + '</span>'; }).join('');
    if (s.length) h += '<span class="lb">새 정리</span>' + s.map(function (x) { return '<span class="it">' + esc(x) + '</span>'; }).join('');
    return h + '</div>';
  }

  function renderLevel() {
    var goals = rt.state.goals;
    var box = el.goalbox;
    if (!goals.length) {
      box.innerHTML = '<div class="glabel">목표</div><div class="goal empty">✓ 모든 목표를 닫았습니다</div>';
    } else {
      var g = goals[0];
      var cnt = goals.length > 1 ? ' <span class="cnt">목표 1 / ' + goals.length + '</span>' : '';
      var rest = goals.length > 1
        ? '<div class="sec">남은 목표</div>' + goals.slice(1).map(function (x, i) {
          return '<div class="hyp" style="display:block;margin-bottom:4px">' + (i + 2) + '. ' + esc(NNG.pp(x.target)) + '</div>';
        }).join('')
        : '';
      box.innerHTML =
        '<div class="glabel">목표' + cnt + '</div>' +
        '<div class="goal">' + esc(NNG.pp(g.target)) + '</div>' +
        '<div class="glabel">가정</div>' + hypsHtml(g.hyps) + rest + newStuffHtml() +
        (rt.level.intro ? '<div class="levelnote"><div class="md">' + md(rt.level.intro) + '</div></div>' : '');
    }

    var lines = rt.lines.map(function (t, i) {
      return '<div class="line"><span class="n">' + (i + 1) + '</span><span>' + esc(t) + '</span><span class="mark">✓</span></div>';
    }).join('');
    el.lines.innerHTML = lines || '<div class="line" style="color:#7d7566">전술을 입력하고 실행을 누르세요.</div>';
    el.lines.scrollTop = el.lines.scrollHeight;

    $('btnUndo').disabled = rt.lines.length === 0;
    currentPaletteTab();
  }

  function showErr(e) {
    var msg = e && e.message ? e.message : String(e);
    if (e && e.detail) msg += '\n' + e.detail;
    el.errbar.textContent = msg;
    el.errbar.classList.add('on');
    if (el.lines) { el.lines.scrollTop = el.lines.scrollHeight; }
  }
  function clearErr() { el.errbar.classList.remove('on'); }

  function runLine() {
    var txt = $('cmd').value.trim();
    if (!txt) return;
    clearErr();
    var next;
    try { next = NNG.execTactic(NNG.clone(rt.state), txt); }
    catch (e) { showErr(e); return; }
    rt.lines.push(txt);
    rt.state = next;
    $('cmd').value = '';
    persistCode();
    renderLevel();
    if (rt.state.goals.length === 0) onCleared();
  }

  function persistCode() {
    var wid = rt.world.id, n = String(rt.level.n);
    S.code[wid] = S.code[wid] || {};
    S.code[wid][n] = rt.lines.slice();
    save();
  }

  function recompute() {
    var st = NNG.mkState({ statement: rt.stmt });
    for (var i = 0; i < rt.lines.length; i++) {
      try { st = NNG.execTactic(NNG.clone(st), rt.lines[i]); }
      catch (e) { rt.lines = rt.lines.slice(0, i); break; }
      if (st.goals.length === 0) { rt.lines = rt.lines.slice(0, i + 1); break; }
    }
    rt.state = st;
    persistCode();
    clearErr();
    renderLevel();
  }

  function undo() {
    if (!rt.lines.length) return;
    rt.lines.pop();
    recompute();
  }

  function resetLevel() {
    if (!rt.lines.length) return;
    rt.lines = [];
    recompute();
    toast('처음부터 다시 시작합니다');
  }

  function onCleared() {
    var wid = rt.world.id, n = rt.level.n;
    S.cleared[wid] = S.cleared[wid] || {};
    var first = !S.cleared[wid][n];
    S.cleared[wid][n] = true;
    save();
    persistCode();

    var nextLv = rt.world.levels[n];
    var nw = NNG_WORLDS[worldIndex(wid) + 1];
    var body =
      '<div class="clearbox"><div class="em">🎉</div><h3>레벨 클리어!</h3>' +
      '<p>' + esc(rt.world.title) + ' · ' + esc(rt.level.title) + '</p></div>' +
      (rt.level.conclusion ? '<div class="md">' + md(rt.level.conclusion) + '</div>' : '');
    var actions = '';
    if (nextLv) actions = '<button class="btn wide accent" id="nextBtn">다음 레벨 (' + (n + 1) + '. ' + esc(nextLv.title) + ')</button>';
    else if (nw) actions = '<button class="btn wide accent" id="nextWorldBtn">다음 월드: ' + esc(nw.title) + '</button>';
    actions += '<div style="height:8px"></div><button class="btn wide ghost" id="mapBtn">월드 맵으로</button>';
    sheet('', body, actions);
    if ($('nextBtn')) $('nextBtn').onclick = function () { closeSheet(); openLevel(wid, n + 1); };
    if ($('nextWorldBtn')) $('nextWorldBtn').onclick = function () { closeSheet(); show('map'); renderMap(); };
    $('mapBtn').onclick = function () { closeSheet(); show('map'); renderMap(); };
    if (first) toast('진행 상황이 저장되었습니다');
  }

  /* ------------------------ 칩 팔레트 ------------------------ */
  function availTacs() {
    var lv = rt.level;
    var list = (lv && S.mode !== 'free') ? (lv._tacs || []).slice() : TAC_DOCS.map(function (d) { return d[0]; });
    if (S.mode === 'free') list = TAC_DOCS.map(function (d) { return d[0]; });
    return list;
  }

  function renderPalette() {
    if (!rt.level) return;
    var tacs = availTacs();
    var order = ['rfl', 'rw', 'nth_rewrite', 'repeat', 'induction', 'cases', 'intro', 'exact', 'apply',
      'use', 'left', 'right', 'symm', 'have', 'contrapose', 'trivial', 'decide', 'tauto', 'simp', 'simp_add', 'xyzzy'];
    var shown = order.filter(function (t) { return tacs.indexOf(t) >= 0; });
    el.prowTac.innerHTML = shown.map(function (t) {
      return '<button class="chip hot" data-ins="' + esc(t) + '">' + esc(t) + '</button>';
    }).join('') +
      '<button class="chip" data-ins="' + esc('') + '" style="display:none"></button>';

    el.prowSym.innerHTML = SYMS.map(function (s) {
      return '<button class="chip sym" data-ins="' + esc(s) + '">' + esc(s) + '</button>';
    }).join('') + NUMS.map(function (s) {
      return '<button class="chip sym" data-ins="' + esc(s) + '">' + esc(s) + '</button>';
    }).join('');

    Array.prototype.forEach.call(el.palette.querySelectorAll('.chip'), function (b) {
      b.onclick = function () { insertText(b.getAttribute('data-ins')); };
    });
  }

  function insertText(text) {
    var inp = $('cmd');
    var start = inp.selectionStart === null ? inp.value.length : inp.selectionStart;
    var end = inp.selectionEnd === null ? inp.value.length : inp.selectionEnd;
    var before = inp.value.slice(0, start), after = inp.value.slice(end);
    var ins = text, caret = null;
    var pair = { rw: ['rw []', 4], nth_rewrite: ['nth_rewrite 2 []', 15], have: ['have  : ', 5], induction: ['induction  with  ', 10], simp: ['simp only []', 11] };
    if (pair[text]) { ins = pair[text][0]; caret = pair[text][1]; }
    else if (/^(left|right|rfl|trivial|decide|tauto|symm|simp_add|xyzzy)$/.test(text)) { ins = text; }
    else if (text && !/\s$/.test(text) && before.length && !/\s$/.test(before) && !/^[\[\),]/.test(text)) { ins = ' ' + text; }
    inp.value = before + ins + after;
    var pos = caret !== null ? before.length + caret : before.length + ins.length;
    inp.focus();
    try { inp.setSelectionRange(pos, pos); } catch (e) { }
  }

  /* ------------------------ 독 ------------------------ */
  function currentPaletteTab() { }
  function renderDock() {
    if (!rt.level) return;
    var tabs = [['tac', '전술'], ['thm', '정리'], ['def', '정의'], ['hint', '힌트']];
    el.tabs.innerHTML = tabs.map(function (t) {
      return '<button class="tab' + (rt.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('');
    Array.prototype.forEach.call(el.tabs.querySelectorAll('.tab'), function (b) {
      b.onclick = function () { rt.tab = b.getAttribute('data-tab'); renderDock(); };
    });
    el.tabBody.innerHTML = rt.tab === 'tac' ? tabTactics() : rt.tab === 'thm' ? tabTheorems() : rt.tab === 'def' ? tabDefs() : tabHints();
    bindDock();
  }

  function tabTactics() {
    var lv = rt.level;
    var avail = (S.mode === 'free') ? TAC_DOCS.map(function (d) { return d[0]; }) : (lv._tacs || []);
    var rows = TAC_DOCS.map(function (d) {
      var locked = S.mode !== 'free' && avail.indexOf(d[0]) < 0;
      if (locked) return '';
      var isNew = (lv.newTacs || []).indexOf(d[0]) >= 0;
      return '<div class="thm">' +
        '<div class="nmrow"><span class="nm">' + esc(d[1]) + (isNew ? '<span class="tag new">새 전술</span>' : '') + '</span>' +
        '<button class="use" data-ins="' + esc(d[0]) + '">넣기</button></div>' +
        '<div class="st ko">' + md(d[2]).replace(/^<p>|(<\/p>)$/g, '') + '</div></div>';
    }).join('');
    return '<div class="sec">이 레벨에서 쓸 수 있는 전술</div>' + rows;
  }

  function tabTheorems() {
    var lv = rt.level;
    var avail = (S.mode === 'free') ? null : (lv._thms || []);
    var byTab = {};
    NNG_THEOREMS.RAW.forEach(function (r) {
      if (avail && avail.indexOf(r[0]) < 0) return;
      (byTab[r[4]] = byTab[r[4]] || []).push(r);
    });
    var order = ['012', '+', '*', '^', 'Peano', '≤'];
    var html = '<div class="sec">사용 가능한 정리 (눌러서 입력)</div>';
    order.forEach(function (k) {
      if (!byTab[k]) return;
      html += '<div class="sec" style="margin-top:10px">' + esc(k) + ' 그룹</div>';
      html += byTab[k].map(function (r) {
        var isNew = (lv.newThms || []).indexOf(r[0]) >= 0;
        return '<div class="thm">' +
          '<div class="nmrow"><span class="nm">' + esc(r[0]) + (isNew ? '<span class="tag new">새 정리</span>' : '') + '</span>' +
          '<button class="use" data-ins="' + esc(r[0]) + '">넣기</button></div>' +
          '<div class="st">' + esc(r[2]) + '</div>' +
          '<div class="st ko" style="font-size:11.5px;color:var(--ink-3)">' + esc(r[3]) + '</div></div>';
      }).join('');
    });
    return html;
  }

  function tabDefs() {
    var defs = [
      ['ℕ', '`0` 은 자연수이고, `n` 이 자연수면 `succ n` 도 자연수입니다. 이 게임의 모든 수는 이 두 규칙으로 만들어집니다.'],
      ['≠', '`a ≠ b` 는 `a = b → False` 의 표기입니다. "a = b 를 가정하면 모순" 이라는 뜻입니다.'],
      ['False / True', '`False` 는 항상 거짓인 명제입니다. `True` 는 항상 참입니다.'],
      ['≤', '`a ≤ b` 는 `∃ c, b = a + c` 의 표기입니다. "b = a + c 인 수 c 가 있다" 는 뜻입니다.'],
      ['∨ / ∧', '`A ∨ B` 는 "A 또는 B", `A ∧ B` 는 "A 이고 B" 입니다. `∨` 는 오른쪽 결합이라 `A ∨ B ∨ C` 는 `A ∨ (B ∨ C)` 입니다.'],
      ['∃ / ∀', '`∃ n, P n` 은 "P 를 만족하는 n 이 있다", `∀ n, P n` 은 "모든 n 에 대해 P" 입니다.'],
      ['is_zero', '`is_zero 0 = True`, `is_zero (succ n) = False`. 0인지 판정하는 함수입니다.'],
      ['pred', '`pred 0 = 37`, `pred (succ n) = n`. 1을 빼는 함수입니다(0에서는 아무 값).']
    ];
    return '<div class="sec">정의와 기호</div>' + defs.map(function (d) {
      return '<div class="card"><h4>' + esc(d[0]) + '</h4><div class="md" style="font-size:12.5px">' + md(d[1]) + '</div></div>';
    }).join('');
  }

  function tabHints() {
    var lv = rt.level;
    var hints = lv.hints || [];
    var n = Math.max(1, Math.min(rt.hint || 1, hints.length));
    var visible = hints.slice(0, n);
    var html = '<div class="sec">힌트</div>';
    if (!hints.length) html += '<div class="muted">이 레벨에는 힌트가 없습니다. 직접 증명해 보세요!</div>';
    html += visible.map(function (h, i) {
      return '<div class="hintitem"><span class="num">' + (i + 1) + '</span><div class="hbody">' + md(h.t) + '</div></div>';
    }).join('');
    if (n < hints.length) {
      html += '<button class="hintmore" id="moreHint">힌트 하나 더 보기 (' + (n + 1) + '/' + hints.length + ')</button>';
    } else if (hints.length) {
      html += '<div class="muted" style="margin-top:2px">힌트를 모두 보았습니다.</div>';
    }
    html += '<div class="sec">막혔을 때</div>' +
      '<button class="hintmore" id="showSol">정답 코드 보기</button>';
    return html;
  }

  function bindDock() {
    Array.prototype.forEach.call(el.tabBody.querySelectorAll('[data-ins]'), function (b) {
      b.onclick = function () { insertText(b.getAttribute('data-ins')); };
    });
    if ($('moreHint')) $('moreHint').onclick = function () { rt.hint = (rt.hint || 1) + 1; renderDock(); };
    if ($('showSol')) $('showSol').onclick = function () {
      var sol = (rt.level.solution || []).join('\n');
      sheet('정답 코드', '<div class="md"><p>아래를 한 줄씩 직접 입력해 보세요. 붙여넣고 싶다면 이 코드를 복사하면 됩니다.</p><pre><code>' + esc(sol) + '</code></pre></div>',
        '<button class="btn wide ghost" id="solClose">닫기</button>');
      $('solClose').onclick = closeSheet;
    };
  }

  /* ------------------------ 화면 전환 ------------------------ */
  function show(id) {
    ['home', 'map', 'level'].forEach(function (s) {
      $('scr-' + s).classList.toggle('on', s === id);
    });
  }

  /* ------------------------ 초기화 ------------------------ */
  function init() {
    ['toast', 'sheetwrap', 'sheetTitle', 'sheetBody', 'homeBody', 'mapBody', 'goalbox', 'lines',
      'errbar', 'prowTac', 'prowSym', 'palette', 'tabs', 'tabBody', 'cmd', 'lvTitle', 'lvSub'].forEach(function (k) { el[k] = $(k); });

    renderHome();

    $('scr-map').querySelector('#backHome').onclick = function () { show('home'); };
    $('scr-level').querySelector('#backMap').onclick = function () { show('map'); renderMap(); };
    $('scr-level').querySelector('#lvInfo').onclick = showIntro;
    $('run').onclick = runLine;
    $('btnUndo').onclick = undo;
    $('btnReset').onclick = resetLevel;
    $('btnHint').onclick = function () { rt.tab = 'hint'; renderDock(); };
    $('cmd').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); runLine(); }
    });
    el.sheetwrap.onclick = function (e) { if (e.target === el.sheetwrap) closeSheet(); };

    // 마지막 위치 복원
    if (S.last && worldById(S.last.w)) {
      // 자동 진입은 하지 않고 맵만 보여준다
    }
    show('home');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
